#  sudo hardening — BUILD_PLAN §4.9
#
#  Always validated with `visudo -c -f <tmpfile>` before install. A broken
#  sudoers file costs you root, so the helper refuses to write one that fails.

[section]
id      = "sudo"
title   = "sudo"
nav     = "Access"
order   = 60
syntax  = "sudoers"
target  = "/etc/sudoers.d/99-oss"
desc    = "sudo policy. Validated with visudo -c before it is installed."

[[flag]]
id      = "sudo_use_pty"
group   = "sudo / session"
key     = "use_pty"
value   = ""
title   = "Run in a pty"
desc    = "Commands get their own terminal"
why     = "Stops a backgrounded process capturing the terminal after sudo exits"
risk    = "safe"

[[flag]]
id      = "sudo_logfile"
needs   = ["gnu-sudo"]
group   = "sudo / logging"
key     = "logfile"
value   = "\"/var/log/sudo.log\""
default = "(syslog only)"
title   = "Dedicated sudo log"
desc    = "Writes /var/log/sudo.log"
why     = "A separate file survives journal rotation and is easy to ship off-box"
risk    = "safe"

[[flag]]
id      = "sudo_log_input"
needs   = ["gnu-sudo"]
group   = "sudo / logging"
key     = "log_input"
value   = ""
title   = "Log session input"
desc    = "Records input to sudo'd commands"
why     = "Lets you reconstruct what was actually run as root after an incident"
help    = "sudo's own I/O logging (sudoers log_input), written by sudo to /var/log/sudo-io, root-only, never leaving the machine. It covers only commands started through sudo. It does NOT capture sudo's own password prompt — that is read before the command starts. It DOES capture the raw input stream inside an interactive `sudo -i` shell, so a password typed at a nested prompt (an ssh passphrase, `passwd`) is recorded even though the screen shows nothing: echo being off does not protect it. Treat these logs as being as sensitive as the shadow file."
risk    = "caution"
breaks  = "Logs grow quickly; records secrets typed at nested prompts"

[[flag]]
id      = "sudo_log_output"
needs   = ["gnu-sudo"]
group   = "sudo / logging"
key     = "log_output"
value   = ""
title   = "Log session output"
desc    = "Records what commands printed"
why     = "Completes the session record"
help    = "Same mechanism and same storage as session input logging. Anything a root command prints — key material, tokens, file contents — ends up in /var/log/sudo-io verbatim."
risk    = "caution"
breaks  = "Large logs; captures command output verbatim"

[[flag]]
id      = "sudo_timestamp_timeout"
group   = "sudo / session"
key     = "timestamp_timeout"
value   = "0"
default = "15"
title   = "Password every time"
desc    = "No credential caching at all"
why     = "A cached sudo timestamp is a window for anything running as you"
risk    = "caution"
breaks  = "Convenience — every sudo prompts again"

[[flag]]
id      = "sudo_passwd_tries"
group   = "sudo / session"
key     = "passwd_tries"
value   = "3"
default = "3"
title   = "Three password tries"
desc    = "Then sudo gives up"
why     = "Limits local password guessing"
risk    = "safe"

[[flag]]
id      = "sudo_passwd_timeout"
group   = "sudo / session"
key     = "passwd_timeout"
value   = "1"
default = "5"
title   = "One-minute prompt timeout"
desc    = "Abandoned prompts close"
why     = "An open password prompt on an unattended screen is an invitation"
risk    = "safe"

[[flag]]
id      = "sudo_no_visiblepw"
group   = "sudo / session"
key     = "!visiblepw"
value   = ""
title   = "Never echo the password"
desc    = "Refuses to run if echo is on"
why     = "Blocks the classic tty-less pipeline that would show your password"
risk    = "safe"

[[flag]]
id      = "sudo_requiretty"
needs   = ["gnu-sudo"]
group   = "sudo / session"
key     = "requiretty"
value   = ""
title   = "Require a real terminal"
desc    = "No sudo from scripts or cron"
why     = "Stops a compromised web app or cron job calling sudo"
risk    = "caution"
breaks  = "Automation, cron jobs and CI that use sudo"

[[flag]]
id      = "sudo_always_set_home"
group   = "sudo / environment"
key     = "always_set_home"
value   = ""
title   = "Reset HOME"
desc    = "HOME becomes the target user's"
why     = "Otherwise root reads config files out of your home directory"
risk    = "safe"

[[flag]]
id      = "sudo_env_reset"
group   = "sudo / environment"
key     = "env_reset"
value   = ""
title   = "Clear the environment"
desc    = "Only a safe set is passed through"
why     = "LD_PRELOAD and friends are how you turn sudo into a root shell"
risk    = "safe"

[[flag]]
id      = "sudo_secure_path"
group   = "sudo / environment"
key     = "secure_path"
value   = "\"/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin\""
default = "(inherited PATH)"
title   = "Fixed PATH"
desc    = "root never uses your PATH"
why     = "A writable directory early in PATH means you choose what root runs"
risk    = "safe"

[[flag]]
id      = "sudo_noexec"
group   = "sudo / environment"
key     = "noexec"
value   = ""
title   = "No shell escapes"
desc    = "Blocks exec() from sudo'd commands"
why     = "Stops :!sh in an editor becoming a root shell"
risk    = "caution"
breaks  = "Anything legitimately spawning children under sudo (apt, make, dpkg)"

[[flag]]
id      = "sudo_umask"
group   = "sudo / environment"
key     = "umask"
value   = "0027"
default = "0022"
title   = "Tighter umask"
desc    = "Root-created files aren't world-readable"
why     = "Files root writes on your behalf shouldn't be readable by everyone"
risk    = "safe"

# --------------------------------------------------------------------------- #
#  more defaults — every one below was checked against sudo-rs with visudo -c,
#  because sudo-rs silently supports a much smaller set than GNU sudo
# --------------------------------------------------------------------------- #

[[flag]]
id      = "sudo_no_pwfeedback"
group   = "sudo / password prompt"
key     = "!pwfeedback"
value   = ""
default = "off"
title   = "No asterisks while typing"
desc    = "Password prompt shows nothing"
why     = "Feedback characters leak your password length to anyone watching the screen"
help    = "pwfeedback has also had its own buffer-overflow bug (CVE-2019-18634). Off is both the safer and the default behaviour."
risk    = "safe"

[[flag]]
id      = "sudo_verifypw_always"
group   = "sudo / password prompt"
key     = "verifypw"
value   = "always"
default = "all"
title   = "Always verify the password"
desc    = "No shortcuts for -v"
why     = "Stops `sudo -v` refreshing your timestamp without actually proving who you are"
risk    = "safe"

[[flag]]
id      = "sudo_lecture_always"
group   = "sudo / password prompt"
key     = "lecture"
value   = "always"
default = "once"
title   = "Show the warning every time"
desc    = "Reminds you before each session"
why     = "Small thing, but it makes an unexpected sudo prompt visible instead of routine"
risk    = "safe"
breaks  = "Extra output before each sudo password prompt"

[[flag]]
id      = "sudo_mail_badpass"
group   = "sudo / logging"
key     = "mail_badpass"
value   = ""
default = "off"
title   = "Mail failed attempts"
desc    = "Sends root mail on a bad password"
why     = "Somebody guessing at sudo on your machine is worth knowing about"
help    = "Only useful if local mail delivery works. Without an MTA the mail is written nowhere and this does nothing."
risk    = "safe"

[[flag]]
id      = "sudo_ignore_dot"
group   = "sudo / environment"
key     = "ignore_dot"
value   = ""
default = "on"
title   = "Ignore '.' in PATH"
desc    = "Won't run from the current directory"
why     = "A '.' in PATH means a file named `ls` in whatever folder you are in runs as root"
risk    = "safe"

[[flag]]
id      = "sudo_targetpw"
group   = "sudo / password prompt"
key     = "targetpw"
value   = ""
default = "off"
title   = "Ask for the target's password"
desc    = "Your own password stops working"
why     = "Running as another user should need that user's password, not yours"
help    = "Read the breaks line twice. With this on, `sudo` needs root's password — and Ubuntu locks the root account by default, so there may not be one. Set a root password first or you lose sudo entirely."
risk    = "breaking"
breaks  = "sudo, unless the target account has a usable password"
