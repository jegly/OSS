#  Module blacklisting — BUILD_PLAN §4.5
#
#  Each selected module emits `blacklist <mod>` + `install <mod> /bin/false`.
#  /bin/false, never /bin/true: it fails loudly instead of pretending to load.
#  Module names use underscores — a hyphenated line is silently ignored.

[section]
id      = "modprobe"
title   = "modprobe.d"
nav     = "System"
order   = 30
syntax  = "modprobe"
target  = "/etc/modprobe.d/99-oss.conf"
reload  = [["/usr/sbin/depmod", "-a"], ["/usr/sbin/update-initramfs", "-u"]]
desc    = "Stop kernel modules loading at all. Already-loaded modules need a reboot."

