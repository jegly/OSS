#  Services & daemons — BUILD_PLAN §4.13
#
#  No file: each selected unit is masked or disabled with systemctl. The UI shows
#  which port each one is listening on (from `ss -ltnup`), so it is obvious what
#  closes when you turn it off.

[section]
id      = "services"
title   = "services"
nav     = "Monitoring"
order   = 82
syntax  = "services"
desc    = "Turn off daemons you don't use. Masking is stronger than disabling."

[[flag]]
id      = "svc_avahi_daemon"
group   = "services / discovery"
key     = "avahi-daemon.service"
value   = "mask"
default = "enabled"
values  = ["disable", "mask"]
labels  = ["disable", "mask (can't be started)"]
title   = "avahi-daemon"
desc    = "mDNS/Bonjour discovery — udp/5353"
why     = "Announces this machine and answers queries from the whole segment"
risk    = "caution"
breaks  = ".local name resolution, network printer discovery"

