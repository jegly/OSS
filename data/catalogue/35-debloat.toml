#  Kernel debloat — the browser behind the curated modprobe section.
#
#  30-modprobe.toml is the curated list: families worth blacklisting on any
#  machine, carried by presets. This section is the other ~6,800 modules on a
#  stock kernel, classified against what the running system actually uses. It
#  has no flags because it is a browser over the live system, not a fixed list.

[section]
id       = "debloat"
title    = "kernel debloat"
nav      = "System"
order    = 35
syntax   = "special"
desc     = "Every loadable module on this kernel, and whether the running system depends on it. A stock kernel ships around 6,900 and boots on about 130 — the rest will autoload on demand, which is the surface this closes. Blacklisting only; deleting the files is explained and not offered."
