# --------------------------------------------------------------------------- #
#  more hardening parameters — each confirmed present in this kernel's config
# --------------------------------------------------------------------------- #

[[flag]]
id      = "ia32_emulation_off"
group   = "grub / memory"
key     = "ia32_emulation"
value   = "0"
default = "1"
title   = "No 32-bit syscall entry"
desc    = "Removes the compat syscall table"
why     = "The 32-bit compatibility layer is a second syscall entry with a long bug history and almost no users"
help    = "Needs CONFIG_IA32_EMULATION, which this kernel has. Anything genuinely 32-bit stops working — check with `file` on your binaries first if unsure."
risk    = "caution"
reboot  = true
breaks  = "32-bit binaries, including some games and old installers"

[[flag]]
id      = "hardened_usercopy"
group   = "grub / memory"
key     = "hardened_usercopy"
value   = "1"
default = "1"
title   = "Check user-space copies"
desc    = "Bounds-checks copy_to/from_user"
why     = "Catches the kernel copying past the end of a buffer, which is how a heap overflow becomes a leak"
risk    = "safe"
reboot  = true
breaks  = "Small overhead on syscall-heavy work"

[[flag]]
id      = "spectre_bhi"
group   = "grub / cpu mitigations"
key     = "spectre_bhi"
value   = "on"
default = "auto"
title   = "Branch History Injection"
desc    = "The 2024 Spectre-v2 variant"
why     = "BHI works around the existing Spectre-v2 defences by poisoning branch history instead"
affects = "Intel from Haswell onward, most notably 6th–11th gen."
risk    = "safe"
reboot  = true

[[flag]]
id      = "iommu_forcedac"
group   = "grub / iommu & dma"
key     = "iommu.forcedac"
value   = "1"
default = "0"
title   = "Force 64-bit DMA"
desc    = "No DMA below the 4GB line"
why     = "Keeps devices out of the low memory that legacy attacks target"
risk    = "caution"
reboot  = true
breaks  = "Old devices that can only address 32 bits"

# --------------------------------------------------------------------------- #
#  newer CPU mitigations
#
#  These three bugs post-date the original catalogue. Each has its own sysfs
#  entry under /sys/devices/system/cpu/vulnerabilities, so the "Not affected"
#  greying works for them once they are mapped in probe.unaffected_mitigations.
# --------------------------------------------------------------------------- #

[[flag]]
id      = "indirect_target_selection"
group   = "grub / cpu mitigations"
key     = "indirect_target_selection"
value   = "on"
default = "auto"
title   = "Mitigate ITS"
desc    = "Indirect Target Selection"
why     = "Intel branch predictors can be steered to a chosen indirect target across privilege boundaries"
affects = "Intel 9th–11th gen Core and contemporary Xeon (Cascade Lake–Rocket Lake). Older cores are not affected."
risk    = "caution"
reboot  = true
breaks  = "Indirect-branch-heavy workloads lose some throughput"

[[flag]]
id      = "tsa_mitigation"
group   = "grub / cpu mitigations"
key     = "tsa"
value   = "on"
default = "auto"
title   = "Mitigate TSA"
desc    = "AMD Transient Scheduler Attacks"
why     = "Scheduler timing on affected AMD parts leaks data from loads that were never architecturally executed"
affects = "AMD only — Zen 3, Zen 4 and Zen 5. Intel is not affected."
risk    = "caution"
reboot  = true
breaks  = "Small scheduling cost on affected AMD CPUs"

[[flag]]
id      = "vmscape_mitigation"
group   = "grub / cpu mitigations"
key     = "vmscape"
value   = "on"
default = "auto"
title   = "Mitigate VMSCAPE"
desc    = "Guest-to-host branch leak"
why     = "A guest can leave branch predictor state that the host userspace process running the VM then leaks through"
affects = "AMD Zen and recent Intel, and only when this machine runs virtual machines."
risk    = "caution"
reboot  = true
breaks  = "IBPB on VM exit costs measurably on virtualisation hosts"

[[flag]]
id      = "l1d_flush_on"
group   = "grub / cpu mitigations"
key     = "l1d_flush"
value   = "on"
default = "off"
title   = "Flush L1D on switch"
desc    = "Opt-in L1 data cache flush"
why     = "Clears the L1 data cache when switching away from a task that asked for it, closing the sibling-thread read that L1TF exploits"
affects = "Intel cores affected by L1TF — Nehalem through Coffee Lake."
risk    = "caution"
reboot  = true
breaks  = "Context-switch cost; only tasks that opt in via prctl are affected"

# --------------------------------------------------------------------------- #
#  newer memory & device hardening
# --------------------------------------------------------------------------- #

[[flag]]
id      = "init_mlocked_on_free"
group   = "grub / memory"
key     = "init_mlocked_on_free"
value   = "1"
default = "0"
title   = "Zero mlocked memory on free"
desc    = "Wipes locked pages when released"
why     = "mlock is what a process uses to keep a key or passphrase out of swap; without this the page is still handed on unzeroed when it is freed"
risk    = "safe"
reboot  = true
breaks  = "Small cost when freeing locked memory"

[[flag]]
id      = "bdev_allow_write_mounted"
group   = "grub / misc"
key     = "bdev_allow_write_mounted"
value   = "0"
default = "1"
title   = "No raw writes to mounted disks"
desc    = "Blocks writing /dev/sda under a live filesystem"
why     = "Writing a block device behind its mounted filesystem corrupts it and is a standard way to plant content the filesystem layer would have refused"
risk    = "caution"
reboot  = true
breaks  = "Disk tools that write to a mounted device on purpose — some backup and imaging software"

[[flag]]
id      = "usb_authorized_default"
group   = "grub / misc"
key     = "usbcore.authorized_default"
value   = "0"
default = "1"
title   = "New USB devices unauthorised"
desc    = "Nothing plugged in works until allowed"
why     = "Closes BadUSB and malicious-HID attacks at the door: a device that is not authorised never gets its driver bound"
risk    = "breaking"
reboot  = true
breaks  = "Every USB device is dead on arrival, including the keyboard you would use to authorise it. Only sensible alongside USBGuard, which is what the usb section configures."
