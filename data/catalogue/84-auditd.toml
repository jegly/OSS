#  Auditd — BUILD_PLAN §4.14
#
#  Each watch group is one flag that emits several rules, so "select all" on the
#  group header is what actually gets used here. auditd is optional: without the
#  package the section shows an install hint instead of the grid.

[section]
id           = "auditd"
title        = "auditd"
nav          = "Monitoring"
order        = 84
syntax       = "auditd"
target       = "/etc/audit/rules.d/99-oss.rules"
reload       = [["/usr/sbin/augenrules", "--load"]]
requires_pkg = "auditd"
desc         = "Kernel audit rules. Rule syntax is checked with auditctl before install."

# --------------------------------------------------------------------------- #
#  buffers & failure mode
# --------------------------------------------------------------------------- #

[[flag]]
id      = "audit_buffer"
group   = "auditd / buffers"
key     = "-b 8192"
value   = "1"
default = "0"
title   = "8192-event buffer"
desc    = "Bigger kernel audit backlog"
why     = "The default backlog overflows during a busy period and drops events"
risk    = "safe"

[[flag]]
id      = "audit_backlog_wait_time"
group   = "auditd / buffers"
key     = "--backlog_wait_time 60000"
value   = "1"
default = "0"
title   = "Wait rather than drop"
desc    = "Blocks briefly when the buffer is full"
why     = "Losing audit events is worse than a momentary stall"
risk    = "caution"
breaks  = "Brief system stalls under heavy audit load"

[[flag]]
id      = "audit_failure_mode"
group   = "auditd / buffers"
key     = "-f 1"
value   = "1"
default = "0"
title   = "Log audit failures"
desc    = "printk on audit system failure"
why     = "You need to know when auditing itself stopped working"
help    = "-f 2 panics the machine instead. That is the correct choice for a high-assurance server and the wrong one for a desktop, so it is not offered here."
risk    = "safe"

[[flag]]
id      = "audit_immutable"
group   = "auditd / buffers"
key     = "-e 2"
value   = "1"
default = "0"
apply_last = true
title   = "Lock the rules"
desc    = "No rule changes until reboot"
why     = "An attacker's first move is to delete the rule that would catch them"
help    = "Emitted last in the file, because every rule after it would be rejected. Changing any audit rule afterwards needs a reboot."
risk    = "one-way"
breaks  = "All audit rule changes until you reboot"

# --------------------------------------------------------------------------- #
#  watch groups
# --------------------------------------------------------------------------- #

[[flag]]
id      = "audit_time_changes"
group   = "auditd / watches"
key     = "-a always,exit -F arch=b64 -S adjtimex,settimeofday,clock_settime -k time-change"
value   = "1"
default = "0"
extra   = [
  "-a always,exit -F arch=b32 -S adjtimex,settimeofday,clock_settime -k time-change",
  "-w /etc/localtime -p wa -k time-change",
]
title   = "Time changes"
desc    = "Clock tampering"
why     = "Moving the clock is how you make log timestamps lie"
risk    = "safe"

[[flag]]
id      = "audit_identity"
group   = "auditd / watches"
key     = "-w /etc/passwd -p wa -k identity"
value   = "1"
default = "0"
extra   = [
  "-w /etc/group -p wa -k identity",
  "-w /etc/gshadow -p wa -k identity",
  "-w /etc/shadow -p wa -k identity",
  "-w /etc/security/opasswd -p wa -k identity",
]
title   = "User and group changes"
desc    = "Writes to passwd, shadow, group"
why     = "Adding an account is the simplest persistence there is"
risk    = "safe"

[[flag]]
id      = "audit_network_env"
group   = "auditd / watches"
key     = "-a always,exit -F arch=b64 -S sethostname,setdomainname -k system-locale"
value   = "1"
default = "0"
extra   = [
  "-a always,exit -F arch=b32 -S sethostname,setdomainname -k system-locale",
  "-w /etc/hosts -p wa -k system-locale",
  "-w /etc/hostname -p wa -k system-locale",
]
title   = "Network environment"
desc    = "Hostname and hosts-file changes"
why     = "A rewritten /etc/hosts redirects updates and telemetry silently"
risk    = "safe"

[[flag]]
#  Split out of audit_network_env: NetworkManager is absent on servers and
#  minimal installs, and one missing watch fails every rule in the file.
id      = "audit_networkmanager"
group   = "auditd / watches"
key     = "-w /etc/NetworkManager/ -p wa -k system-locale"
value   = "1"
default = "0"
title   = "NetworkManager configuration"
desc    = "Writes to /etc/NetworkManager"
why     = "Connection profiles set DNS, proxies and VPNs; a changed profile reroutes traffic without touching /etc/hosts"
needs   = ["path:/etc/NetworkManager"]
risk    = "safe"

[[flag]]
id      = "audit_mac_policy"
group   = "auditd / watches"
key     = "-w /etc/apparmor/ -p wa -k MAC-policy"
value   = "1"
default = "0"
extra   = ["-w /etc/apparmor.d/ -p wa -k MAC-policy"]
title   = "MAC policy changes"
desc    = "AppArmor profile edits"
why     = "Weakening a profile is quieter than disabling AppArmor outright"
risk    = "safe"

#  This bundled five watches, three of which point at paths that do not exist on
#  a current Ubuntu: /var/run/utmp (systemd 256 dropped utmp), /var/run/faillock
#  (created on demand by pam_faillock) and, historically, wtmp/btmp. auditctl
#  loads a rule file as a set, so one missing path fails *every* rule in it —
#  enabling this took the whole audit configuration down with it, silently.
#  `needs` gates a whole flag, so the only correct fix is one watch per flag,
#  each gated on its own path. wtmp, btmp and utmp are separate flags below.

[[flag]]
id      = "audit_logins"
group   = "auditd / watches"
key     = "-w /var/log/lastlog -p wa -k logins"
value   = "1"
default = "0"
title   = "Last-login records"
desc    = "Writes to /var/log/lastlog"
why     = "lastlog is what reports when each account last logged in; editing it hides that a dormant account was used"
needs   = ["path:/var/log/lastlog"]
risk    = "safe"

[[flag]]
id      = "audit_faillock"
group   = "auditd / watches"
key     = "-w /var/run/faillock -p wa -k logins"
value   = "1"
default = "0"
title   = "Failed-login counters"
desc    = "Writes to /var/run/faillock"
why     = "pam_faillock's counters are what lock an account after repeated failures, so clearing them resets a brute-force attempt"
#  Created on demand the first time pam_faillock records a failure, so it is
#  routinely absent on a healthy machine.
needs   = ["path:/var/run/faillock"]
risk    = "safe"

[[flag]]
id      = "audit_perm_mod"
group   = "auditd / watches"
key     = "-a always,exit -F arch=b64 -S chmod,fchmod,fchmodat,setxattr,lsetxattr,fsetxattr,removexattr,lremovexattr,fremovexattr -F auid>=1000 -F auid!=4294967295 -k perm_mod"
value   = "1"
default = "0"
extra   = [
  "-a always,exit -F arch=b32 -S chmod,fchmod,fchmodat,setxattr,lsetxattr,fsetxattr,removexattr,lremovexattr,fremovexattr -F auid>=1000 -F auid!=4294967295 -k perm_mod",
  "-a always,exit -F arch=b64 -S chown,fchown,fchownat,lchown -F auid>=1000 -F auid!=4294967295 -k perm_mod",
  "-a always,exit -F arch=b32 -S chown,fchown,fchownat,lchown -F auid>=1000 -F auid!=4294967295 -k perm_mod",
]
title   = "Permission changes"
desc    = "chmod, chown and xattr calls"
why     = "Loosening a permission is how a foothold becomes persistence"
risk    = "caution"
breaks  = "High log volume on a busy desktop"

[[flag]]
id      = "audit_access_denied"
group   = "auditd / watches"
key     = "-a always,exit -F arch=b64 -S open,openat,truncate,ftruncate,creat -F exit=-EACCES -F auid>=1000 -F auid!=4294967295 -k access"
value   = "1"
default = "0"
extra   = [
  "-a always,exit -F arch=b64 -S open,openat,truncate,ftruncate,creat -F exit=-EPERM -F auid>=1000 -F auid!=4294967295 -k access",
  "-a always,exit -F arch=b32 -S open,openat,truncate,ftruncate,creat -F exit=-EACCES -F auid>=1000 -F auid!=4294967295 -k access",
  "-a always,exit -F arch=b32 -S open,openat,truncate,ftruncate,creat -F exit=-EPERM -F auid>=1000 -F auid!=4294967295 -k access",
]
title   = "Failed file access"
desc    = "Permission-denied opens"
why     = "A burst of denials is someone enumerating what they can reach"
risk    = "caution"
breaks  = "Very high log volume"

[[flag]]
id      = "audit_privileged_exec"
group   = "auditd / watches"
key     = "-a always,exit -F arch=b64 -F euid=0 -S execve -k rootcmd"
value   = "1"
default = "0"
extra   = ["-a always,exit -F arch=b32 -F euid=0 -S execve -k rootcmd"]
title   = "Commands run as root"
desc    = "Every execve with euid 0"
why     = "The single most useful audit rule for reconstructing an intrusion"
risk    = "caution"
breaks  = "High log volume"

[[flag]]
id      = "audit_mounts"
group   = "auditd / watches"
key     = "-a always,exit -F arch=b64 -S mount -F auid>=1000 -F auid!=4294967295 -k mounts"
value   = "1"
default = "0"
extra   = ["-a always,exit -F arch=b32 -S mount -F auid>=1000 -F auid!=4294967295 -k mounts"]
title   = "Filesystem mounts"
desc    = "Successful mount calls by users"
why     = "Mounting removable media is how data leaves and malware arrives"
risk    = "safe"

[[flag]]
id      = "audit_deletions"
group   = "auditd / watches"
key     = "-a always,exit -F arch=b64 -S unlink,unlinkat,rename,renameat -F auid>=1000 -F auid!=4294967295 -k delete"
value   = "1"
default = "0"
extra   = ["-a always,exit -F arch=b32 -S unlink,unlinkat,rename,renameat -F auid>=1000 -F auid!=4294967295 -k delete"]
title   = "File deletions"
desc    = "unlink and rename by users"
why     = "Anti-forensics starts with deleting things"
risk    = "caution"
breaks  = "Very high log volume — every temp file counts"

[[flag]]
id      = "audit_sudoers"
group   = "auditd / watches"
key     = "-w /etc/sudoers -p wa -k scope"
value   = "1"
default = "0"
extra   = ["-w /etc/sudoers.d/ -p wa -k scope"]
title   = "sudoers changes"
desc    = "Edits to sudo policy"
why     = "A NOPASSWD line added to sudoers.d is silent, permanent root"
risk    = "safe"

[[flag]]
id      = "audit_modules"
group   = "auditd / watches"
key     = "-a always,exit -F arch=b64 -S init_module,finit_module,delete_module -k modules"
value   = "1"
default = "0"
extra   = [
  "-a always,exit -F arch=b32 -S init_module,finit_module,delete_module -k modules",
  "-w /usr/sbin/insmod -p x -k modules",
  "-w /usr/sbin/rmmod -p x -k modules",
  "-w /usr/sbin/modprobe -p x -k modules",
]
title   = "Kernel module loads"
desc    = "insmod, rmmod and the syscalls"
why     = "A loaded module can hide everything else from you"
risk    = "safe"

[[flag]]
id      = "audit_privileged_cmds"
group   = "auditd / watches"
key     = "-w /usr/bin/sudo -p x -k privileged"
value   = "1"
default = "0"
extra   = [
  "-w /usr/bin/su -p x -k privileged",
  "-w /usr/bin/passwd -p x -k privileged",
  "-w /usr/sbin/usermod -p x -k privileged",
  "-w /usr/sbin/useradd -p x -k privileged",
  "-w /usr/sbin/userdel -p x -k privileged",
  "-w /usr/bin/chage -p x -k privileged",
  "-w /usr/bin/crontab -p x -k privileged",
]
title   = "Privileged command use"
desc    = "sudo, su, passwd, useradd"
why     = "Covers every normal route to elevated privilege"
risk    = "safe"

[[flag]]
#  Split out of audit_privileged_cmds: pkexec is its own package, separate from
#  polkit, and not always installed. One missing watch fails every rule in the file.
id      = "audit_pkexec"
group   = "auditd / watches"
key     = "-w /usr/bin/pkexec -p x -k privileged"
value   = "1"
default = "0"
title   = "pkexec use"
desc    = "Runs of /usr/bin/pkexec"
why     = "pkexec is polkit's route to root, used by graphical admin tools"
needs   = ["path:/usr/bin/pkexec"]
risk    = "safe"

# --------------------------------------------------------------------------- #
#  more watch groups — syscall numbers and paths verified against this kernel
#  and filesystem before being added; the ssh one is gated behind a real check
#  rather than assumed, since openssh-server is not always installed
# --------------------------------------------------------------------------- #

[[flag]]
#  /etc/sysctl.d is the directory this app writes to and always exists;
#  /etc/sysctl.conf is the legacy file and is absent on a current Ubuntu, so it
#  was the key and would have failed the whole rule set. Swapped: the directory
#  that exists is the watch, and the legacy file is its own gated flag.
id      = "audit_kernel_params"
group   = "auditd / watches"
key     = "-w /etc/sysctl.d/ -p wa -k sysctl"
value   = "1"
default = "0"
title   = "sysctl config changes"
desc    = "Edits under /etc/sysctl.d"
why     = "This is the directory this app writes to — knowing when it changes outside the app is worth having"
needs   = ["path:/etc/sysctl.d"]
risk    = "safe"

[[flag]]
id      = "audit_sysctl_conf"
group   = "auditd / watches"
key     = "-w /etc/sysctl.conf -p wa -k sysctl"
value   = "1"
default = "0"
title   = "Legacy sysctl.conf changes"
desc    = "Edits to /etc/sysctl.conf"
why     = "Still read when present, and still outranks nothing — but a file most machines no longer ship"
needs   = ["path:/etc/sysctl.conf"]
risk    = "safe"

[[flag]]
id      = "audit_ssh_config"
group   = "auditd / watches"
key     = "-w /etc/ssh/sshd_config -p wa -k sshd"
value   = "1"
default = "0"
extra   = ["-w /etc/ssh/sshd_config.d/ -p wa -k sshd"]
needs   = ["path:/etc/ssh/sshd_config"]
title   = "sshd config changes"
desc    = "Edits to the SSH server config"
why     = "sshd_config is the single file that decides whether the network can reach a shell"
risk    = "safe"

[[flag]]
id      = "audit_pam_config"
group   = "auditd / watches"
key     = "-w /etc/pam.d/ -p wa -k pam"
value   = "1"
default = "0"
title   = "PAM config changes"
desc    = "Edits to the PAM stack"
why     = "A single added line in a PAM file can add a silent authentication bypass"
risk    = "safe"

[[flag]]
id      = "audit_cron"
group   = "auditd / watches"
key     = "-w /etc/crontab -p wa -k cron"
value   = "1"
default = "0"
extra   = [
  "-w /etc/cron.d/ -p wa -k cron",
  "-w /etc/cron.daily/ -p wa -k cron",
  "-w /etc/cron.hourly/ -p wa -k cron",
  "-w /etc/cron.monthly/ -p wa -k cron",
  "-w /etc/cron.weekly/ -p wa -k cron",
  "-w /var/spool/cron/crontabs/ -p wa -k cron",
]
title   = "Scheduled task changes"
desc    = "Edits to cron and its spool"
why     = "A cron entry is quiet, scheduled persistence — it runs again on its own with no further action"
risk    = "safe"

[[flag]]
id      = "audit_systemd_units"
group   = "auditd / watches"
key     = "-w /etc/systemd/system/ -p wa -k systemd-units"
value   = "1"
default = "0"
title   = "systemd unit changes"
desc    = "Edits to installed and overridden units"
why     = "A unit file is another way to get something running unattended, same idea as cron"
risk    = "safe"

[[flag]]
id      = "audit_modprobe_config"
group   = "auditd / watches"
key     = "-w /etc/modprobe.d/ -p wa -k modprobe-config"
value   = "1"
default = "0"
title   = "modprobe config changes"
desc    = "Edits to module options and blacklists"
why     = "This is where this app's own module blacklist lives — worth knowing if something rewrites it"
risk    = "safe"

[[flag]]
id      = "audit_own_config"
group   = "auditd / watches"
key     = "-w /etc/audit/ -p wa -k auditconfig"
value   = "1"
default = "0"
#  Ships with auditd, so it exists whenever this section is available at all —
#  gated anyway, because a rule file is loaded as a set and one missing path
#  fails every other rule in it.
needs   = ["path:/etc/audit"]
title   = "audit's own config"
desc    = "Edits to /etc/audit/ itself"
why     = "Rules can no longer be changed once -e 2 is set, but an attempt to is itself worth a log line — this rule has to load before -e 2 locks the file, so it belongs earlier and does"
risk    = "safe"

[[flag]]
id      = "audit_limits"
group   = "auditd / watches"
key     = "-w /etc/security/limits.conf -p wa -k security-limits"
value   = "1"
default = "0"
extra   = ["-w /etc/security/limits.d/ -p wa -k security-limits"]
title   = "Resource limit changes"
desc    = "Edits to ulimit-style limits"
why     = "Raising a core-dump or file-descriptor limit for one user is a quiet way to weaken the whole box"
risk    = "safe"

[[flag]]
id      = "audit_login_defs"
group   = "auditd / watches"
key     = "-w /etc/login.defs -p wa -k login-defs"
value   = "1"
default = "0"
title   = "login.defs changes"
desc    = "Edits to account-creation defaults"
why     = "This is the file behind the password-aging and login-defaults section — watching it catches a change made outside the app"
risk    = "safe"

[[flag]]
id      = "audit_ptrace"
group   = "auditd / watches"
key     = "-a always,exit -F arch=b64 -S ptrace -F auid>=1000 -F auid!=4294967295 -k tracing"
value   = "1"
default = "0"
extra   = ["-a always,exit -F arch=b32 -S ptrace -F auid>=1000 -F auid!=4294967295 -k tracing"]
title   = "ptrace use"
desc    = "Attaching a debugger to another process"
why     = "ptrace is how a credential is read out of a running process's memory, and how process injection works"
risk    = "caution"
breaks  = "Noisy on a dev machine — debuggers and some sandboxes use ptrace constantly"

[[flag]]
id      = "audit_namespaces"
group   = "auditd / watches"
key     = "-a always,exit -F arch=b64 -S unshare,setns -F auid>=1000 -F auid!=4294967295 -k namespaces"
value   = "1"
default = "0"
extra   = ["-a always,exit -F arch=b32 -S unshare,setns -F auid>=1000 -F auid!=4294967295 -k namespaces"]
title   = "Namespace creation"
desc    = "unshare and setns by users"
why     = "A new user namespace is how an unprivileged process gets a root-like view of itself — the first step in a lot of container-escape and privilege-confusion bugs"
risk    = "caution"
breaks  = "Noisy wherever containers or sandboxes run — both use namespaces constantly"

[[flag]]
id      = "audit_bpf"
group   = "auditd / watches"
key     = "-a always,exit -F arch=b64 -S bpf -F auid>=1000 -F auid!=4294967295 -k bpf-use"
value   = "1"
default = "0"
title   = "BPF program loads"
desc    = "The bpf() syscall by users"
why     = "A loaded BPF program can read kernel memory or filter packets — legitimate uses exist, but so do rootkits built entirely on it"
risk    = "caution"
breaks  = "Anything using eBPF for tracing or networking logs a line each time"

# --------------------------------------------------------------------------- #
#  identity files the original identity rule missed
#
#  The existing rule watches /etc/passwd alone. Adding a user touches passwd,
#  shadow, group and gshadow; changing a password or a group membership may
#  touch only one of the other three, and none of those were recorded.
# --------------------------------------------------------------------------- #

[[flag]]
id      = "audit_identity_shadow"
group   = "auditd / watches"
key     = "-w /etc/shadow -p wa -k identity"
value   = "1"
default = "0"
title   = "Password hash changes"
desc    = "Writes to /etc/shadow"
why     = "Every password change and every account with a hash edited into it by hand lands here and nowhere else"
risk    = "safe"

[[flag]]
id      = "audit_identity_group"
group   = "auditd / watches"
key     = "-w /etc/group -p wa -k identity"
value   = "1"
default = "0"
title   = "Group membership changes"
desc    = "Writes to /etc/group"
why     = "Adding an account to sudo, adm or docker is a privilege escalation and it is written here"
risk    = "safe"

[[flag]]
id      = "audit_identity_gshadow"
group   = "auditd / watches"
key     = "-w /etc/gshadow -p wa -k identity"
value   = "1"
default = "0"
title   = "Group password changes"
desc    = "Writes to /etc/gshadow"
why     = "Completes the identity set — a group password is a way into a group without being listed in it"
risk    = "safe"

[[flag]]
id      = "audit_session_wtmp"
group   = "auditd / watches"
key     = "-w /var/log/wtmp -p wa -k session"
value   = "1"
default = "0"
title   = "Login records"
desc    = "Writes to /var/log/wtmp"
why     = "wtmp is what `last` reads; editing it is the standard way to remove evidence of a login"
needs   = ["path:/var/log/wtmp"]
risk    = "safe"

[[flag]]
id      = "audit_session_btmp"
group   = "auditd / watches"
key     = "-w /var/log/btmp -p wa -k session"
value   = "1"
default = "0"
title   = "Failed login records"
desc    = "Writes to /var/log/btmp"
why     = "btmp holds failed attempts, so it is the file that shows a password guess in progress"
needs   = ["path:/var/log/btmp"]
risk    = "safe"

[[flag]]
id      = "audit_session_utmp"
group   = "auditd / watches"
key     = "-w /var/run/utmp -p wa -k session"
value   = "1"
default = "0"
title   = "Active session records"
desc    = "Writes to /var/run/utmp"
why     = "utmp lists who is logged in now, which is what an intruder edits to not be there"
#  systemd 256 dropped utmp, so Ubuntu 26.04 and equivalents have no such file.
#  Without this gate the watch loads, auditctl rejects the missing path, and the
#  whole rule set — every other rule in this section — fails with it.
needs   = ["path:/var/run/utmp"]
risk    = "safe"

[[flag]]
id      = "audit_time_localtime"
group   = "auditd / watches"
key     = "-w /etc/localtime -p wa -k time-change"
value   = "1"
default = "0"
title   = "Timezone changes"
desc    = "Writes to /etc/localtime"
why     = "Moving the clock is how log timestamps are made to disagree with everyone else's"
risk    = "safe"

[[flag]]
id      = "audit_hosts_file"
group   = "auditd / watches"
key     = "-w /etc/hosts -p wa -k system-locale"
value   = "1"
default = "0"
title   = "Hosts file changes"
desc    = "Writes to /etc/hosts"
why     = "One line in /etc/hosts redirects a name to an attacker's address and outranks DNS entirely"
risk    = "safe"

[[flag]]
id      = "audit_passwd_binary"
group   = "auditd / watches"
key     = "-w /usr/bin/passwd -p x -k privileged"
value   = "1"
default = "0"
title   = "passwd invocations"
desc    = "Execution of /usr/bin/passwd"
why     = "The sudo binary is already watched; passwd is the other setuid path routinely used to take an account over"
risk    = "safe"

# --------------------------------------------------------------------------- #
#  syscalls the permission rule missed
# --------------------------------------------------------------------------- #

[[flag]]
id      = "audit_perm_chown"
group   = "auditd / syscalls"
key     = "-a always,exit -F arch=b64 -S chown,fchown,fchownat,lchown -F auid>=1000 -F auid!=4294967295 -k perm_mod"
value   = "1"
default = "0"
title   = "Ownership changes"
desc    = "chown and its variants"
why     = "The existing perm_mod rule covers chmod and xattrs but not chown, so giving a file away was the one permission change that went unrecorded"
risk    = "safe"

[[flag]]
id      = "audit_clock_adjtime"
group   = "auditd / syscalls"
key     = "-a always,exit -F arch=b64 -S clock_adjtime -k time-change"
value   = "1"
default = "0"
title   = "Fine clock adjustments"
desc    = "clock_adjtime syscall"
why     = "adjtimex and settimeofday are already watched; clock_adjtime is the third way to move the clock and was not"
risk    = "safe"

[[flag]]
id      = "audit_module_binaries"
group   = "auditd / watches"
key     = "-w /usr/sbin/insmod -p x -k modules"
value   = "1"
default = "0"
title   = "Module tool use"
desc    = "Execution of insmod"
why     = "The syscall rule catches loading a module; this catches the tool being run, which survives a syscall rule being flushed"
extra   = ["-w /usr/sbin/modprobe -p x -k modules", "-w /usr/sbin/rmmod -p x -k modules"]
#  All three are kmod symlinks and live in /sbin on some families.
needs   = ["path:/usr/sbin/insmod", "path:/usr/sbin/modprobe", "path:/usr/sbin/rmmod"]
risk    = "safe"
