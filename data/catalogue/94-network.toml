#  NetworkManager & MAC privacy — BUILD_PLAN §4.20

[section]
id      = "network"
title   = "network"
nav     = "Network"
order   = 94
syntax  = "ini"
target  = "/etc/NetworkManager/conf.d/99-oss.conf"
reload  = [["/usr/bin/systemctl", "reload", "NetworkManager.service"]]
desc    = "MAC-address privacy and LAN name-broadcast settings in NetworkManager."

[[flag]]
id          = "nm_scan_rand_mac"
group       = "network / mac privacy"
key         = "wifi.scan-rand-mac-address"
value       = "yes"
default     = "yes"
ini_section = "device"
title       = "Random MAC while scanning"
desc        = "Probe requests use a throwaway MAC"
why         = "Your real MAC is broadcast in every scan otherwise — that's how shop Wi-Fi tracks you"
risk        = "safe"

[[flag]]
id          = "nm_wifi_cloned_mac"
group       = "network / mac privacy"
key         = "wifi.cloned-mac-address"
value       = "stable"
default     = "preserve"
values      = ["preserve", "stable", "random"]
labels       = ["real MAC", "stable per network", "fully random"]
ini_section = "connection"
title       = "Wi-Fi MAC policy"
desc        = "Which MAC you connect with"
why         = "A constant MAC identifies your machine across every network it joins"
help        = "'stable' derives a different but consistent MAC per network — you stay unlinkable across networks while DHCP reservations and captive portals keep working. 'random' changes on every connection and is what breaks them."
risk        = "caution"
breaks      = "'random' breaks MAC-based DHCP reservations, captive portals, enterprise 802.1X"

[[flag]]
id          = "nm_ethernet_cloned_mac"
group       = "network / mac privacy"
key         = "ethernet.cloned-mac-address"
value       = "stable"
default     = "preserve"
values      = ["preserve", "stable", "random"]
labels      = ["real MAC", "stable per network", "fully random"]
ini_section = "connection"
title       = "Ethernet MAC policy"
desc        = "Same, for wired connections"
why         = "Wired MACs are just as identifying as wireless ones"
risk        = "caution"
breaks      = "'random' breaks wired DHCP reservations and port security"

[[flag]]
id          = "nm_stable_id"
group       = "network / mac privacy"
key         = "connection.stable-id"
value       = "${CONNECTION}/${BOOT}"
default     = "${CONNECTION}"
ini_section = "connection"
title       = "Re-randomise each boot"
desc        = "Stable MAC changes on reboot"
why         = "Keeps per-network stability but drops the long-term identifier"
risk        = "caution"
breaks      = "DHCP reservations that expect the same MAC after a reboot"

[[flag]]
id          = "nm_ip6_privacy"
group       = "network / mac privacy"
key         = "ipv6.ip6-privacy"
value       = "2"
default     = "-1"
values      = ["0", "1", "2"]
labels      = ["off", "enabled, prefer public", "enabled, prefer temporary"]
ini_section = "connection"
title       = "IPv6 privacy extensions"
desc        = "Rotating IPv6 source addresses"
why         = "A MAC-derived IPv6 address follows you across every network"
risk        = "safe"

[[flag]]
id          = "nm_mdns"
group       = "network / lan leaks"
key         = "connection.mdns"
value       = "0"
default     = "-1"
values      = ["0", "1", "2"]
labels      = ["off", "resolve only", "resolve and announce"]
ini_section = "connection"
title       = "No mDNS in NetworkManager"
desc        = "Second half of the resolved switch"
why         = "resolved and NetworkManager both have to agree, or mDNS comes back"
risk        = "caution"
breaks      = "Network printer and cast-device discovery"

[[flag]]
id          = "nm_llmnr"
group       = "network / lan leaks"
key         = "connection.llmnr"
value       = "0"
default     = "-1"
values      = ["0", "1", "2"]
labels      = ["off", "resolve only", "resolve and announce"]
ini_section = "connection"
title       = "No LLMNR in NetworkManager"
desc        = "Same, for LLMNR"
why         = "Stops your hostname being announced to the segment"
risk        = "safe"

# --------------------------------------------------------------------------- #
#  what the machine tells the network about itself
# --------------------------------------------------------------------------- #

[[flag]]
id          = "nm_no_dhcp_hostname_v4"
group       = "network / identity"
key         = "ipv4.dhcp-send-hostname"
value       = "false"
default     = "true"
ini_section = "connection"
title       = "Don't send your hostname (IPv4)"
desc        = "DHCP request carries no name"
why         = "Otherwise every network you join is handed your machine's name, which follows you between them"
risk        = "safe"
breaks      = "DHCP-registered DNS names on managed networks"

[[flag]]
id          = "nm_no_dhcp_hostname_v6"
group       = "network / identity"
key         = "ipv6.dhcp-send-hostname"
value       = "false"
default     = "true"
ini_section = "connection"
title       = "Don't send your hostname (IPv6)"
desc        = "Same for DHCPv6"
why         = "The IPv4 setting alone leaves the IPv6 request still announcing you"
risk        = "safe"

[[flag]]
id          = "nm_addr_gen_mode"
group       = "network / identity"
key         = "ipv6.addr-gen-mode"
value       = "stable-privacy"
default     = "default"
ini_section = "connection"
title       = "No MAC in your IPv6 address"
desc        = "Derives the interface ID from a secret"
why         = "The old EUI-64 scheme embeds your MAC address in every IPv6 address you use"
help        = "ip6-privacy handles the temporary outbound addresses. This one covers the permanent address, which otherwise still carries the hardware ID."
risk        = "safe"

[[flag]]
id          = "nm_dns_over_tls"
group       = "network / dns"
key         = "connection.dns-over-tls"
value       = "opportunistic"
default     = "default"
values      = ["opportunistic", "yes"]
labels      = ["use it when available", "require it"]
ini_section = "connection"
title       = "Encrypt DNS lookups"
desc        = "DNS over TLS via resolved"
why         = "Plain DNS shows every site you visit to the network you are on"
help        = "'Require it' fails resolution outright if the server does not support DoT, which is the honest setting but breaks on captive portals and plenty of home routers. 'When available' falls back to plain DNS, so it protects you where it can without stranding you."
risk        = "caution"
breaks      = "Resolvers without DoT support, and captive-portal logins"
