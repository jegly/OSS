#  SSH — BUILD_PLAN §4.7
#
#  The helper runs `sshd -t` against the candidate config and refuses to install
#  it if that fails, checks an authorised key exists before killing password auth,
#  and warns when $SSH_CONNECTION is set.

[section]
id           = "ssh"
title        = "ssh"
nav          = "Network"
order        = 50
syntax       = "sshd"
target       = "/etc/ssh/sshd_config.d/99-oss.conf"
reload       = [["/usr/bin/systemctl", "try-reload-or-restart", "ssh.service"]]
requires_pkg = "openssh-server"
desc         = "Server-side SSH policy. Validated with sshd -t before it is installed."

# --------------------------------------------------------------------------- #
#  authentication
# --------------------------------------------------------------------------- #

[[flag]]
id      = "ssh_permit_root_login"
group   = "ssh / authentication"
key     = "PermitRootLogin"
value   = "no"
default = "prohibit-password"
title   = "No root login"
desc    = "root can't log in over SSH"
why     = "Removes the one account name every attacker already knows"
risk    = "safe"

[[flag]]
id      = "ssh_password_authentication"
group   = "ssh / authentication"
key     = "PasswordAuthentication"
value   = "no"
default = "yes"
title   = "Keys only"
desc    = "Turns off password logins"
why     = "Passwords can be brute-forced; keys cannot"
help    = "The app refuses to apply this unless at least one authorised key already exists for a user who is still allowed to log in."
risk    = "caution"
breaks  = "Password logins — lock-out risk if you have no key"

[[flag]]
id      = "ssh_permit_empty_passwords"
group   = "ssh / authentication"
key     = "PermitEmptyPasswords"
value   = "no"
default = "no"
title   = "No empty passwords"
desc    = "Refuses accounts with no password"
why     = "An empty password is an open door"
risk    = "safe"

[[flag]]
id      = "ssh_kbd_interactive"
group   = "ssh / authentication"
key     = "KbdInteractiveAuthentication"
value   = "no"
default = "yes"
title   = "No keyboard-interactive"
desc    = "Closes the PAM password path"
why     = "Otherwise password auth sneaks back in through PAM"
risk    = "caution"
breaks  = "2FA prompts that use keyboard-interactive"

[[flag]]
id      = "ssh_challenge_response"
group   = "ssh / authentication"
key     = "ChallengeResponseAuthentication"
value   = "no"
default = "no"
title   = "No challenge-response"
desc    = "Legacy alias of the above"
why     = "Older sshd builds read this name instead"
risk    = "safe"

[[flag]]
id      = "ssh_pubkey_authentication"
group   = "ssh / authentication"
key     = "PubkeyAuthentication"
value   = "yes"
default = "yes"
title   = "Public-key auth on"
desc    = "The mechanism you keep"
why     = "Must stay on if you are turning passwords off"
risk    = "safe"

[[flag]]
id      = "ssh_authentication_methods"
group   = "ssh / authentication"
key     = "AuthenticationMethods"
value   = "publickey"
default = "any"
title   = "Require public key"
desc    = "Only one method is acceptable"
why     = "States the policy explicitly instead of relying on defaults"
risk    = "caution"
breaks  = "Any other auth method, including 2FA combinations"

[[flag]]
id      = "ssh_hostbased_authentication"
group   = "ssh / authentication"
key     = "HostbasedAuthentication"
value   = "no"
default = "no"
title   = "No host-based auth"
desc    = "Trusting a hostname isn't auth"
why     = "Host-based trust is spoofable and transitive"
risk    = "safe"

[[flag]]
id      = "ssh_ignore_rhosts"
group   = "ssh / authentication"
key     = "IgnoreRhosts"
value   = "yes"
default = "yes"
title   = "Ignore .rhosts"
desc    = "Users can't grant trust themselves"
why     = "A user-writable file should never confer login rights"
risk    = "safe"

[[flag]]
id      = "ssh_use_pam"
group   = "ssh / authentication"
key     = "UsePAM"
value   = "yes"
default = "yes"
title   = "Use PAM"
desc    = "Keeps account and session checks"
why     = "PAM is what enforces faillock, expiry and session limits"
risk    = "safe"

[[flag]]
id      = "ssh_strict_modes"
group   = "ssh / authentication"
key     = "StrictModes"
value   = "yes"
default = "yes"
title   = "Check key file modes"
desc    = "Refuses group-writable key files"
why     = "A group-writable authorized_keys is anyone's authorized_keys"
risk    = "safe"

[[flag]]
id       = "ssh_allow_users"
group    = "ssh / authentication"
key      = "AllowUsers"
value    = ""
default  = ""
editable = true
pattern  = "[a-z_][a-z0-9_-]{0,31}( [a-z_][a-z0-9_-]{0,31})*"
title    = "Allowed users"
desc    = "Explicit login allowlist"
why     = "Turns login from opt-out into opt-in"
help    = "Set the user list in the section header before enabling. Applying this with the wrong list is the fastest way to lock yourself out."
risk    = "caution"
breaks  = "Login for every account not on the list"

# --------------------------------------------------------------------------- #
#  limits
# --------------------------------------------------------------------------- #

[[flag]]
id      = "ssh_max_auth_tries"
group   = "ssh / limits"
key     = "MaxAuthTries"
value   = "3"
default = "6"
title   = "Three auth attempts"
desc    = "Disconnects after 3 failures"
why     = "Slows credential guessing to a crawl"
risk    = "safe"

[[flag]]
id      = "ssh_max_sessions"
group   = "ssh / limits"
key     = "MaxSessions"
value   = "2"
default = "10"
title   = "Two sessions per connection"
desc    = "Limits multiplexed channels"
why     = "Bounds what one hijacked connection can open"
risk    = "safe"

[[flag]]
id      = "ssh_max_startups"
group   = "ssh / limits"
key     = "MaxStartups"
value   = "10:30:60"
default = "10:30:100"
title   = "Throttle new connections"
desc    = "Random early drop when flooded"
why     = "Keeps a connection flood from exhausting sshd"
risk    = "safe"

[[flag]]
id      = "ssh_login_grace_time"
group   = "ssh / limits"
key     = "LoginGraceTime"
value   = "30"
default = "120"
title   = "30-second login window"
desc    = "Unauthenticated sockets die fast"
why     = "Shrinks the pre-auth attack window — where the worst CVEs live"
risk    = "safe"

[[flag]]
id      = "ssh_client_alive_interval"
group   = "ssh / limits"
key     = "ClientAliveInterval"
value   = "300"
default = "0"
title   = "Idle timeout probe"
desc    = "Checks the client every 5 minutes"
why     = "Abandoned sessions are unattended root shells"
risk    = "safe"

[[flag]]
id      = "ssh_client_alive_count_max"
group   = "ssh / limits"
key     = "ClientAliveCountMax"
value   = "2"
default = "3"
title   = "Drop after 2 misses"
desc    = "Ends the session ~10 minutes idle"
why     = "Completes the idle-session timeout"
risk    = "safe"

# --------------------------------------------------------------------------- #
#  forwarding
# --------------------------------------------------------------------------- #

[[flag]]
id      = "ssh_x11_forwarding"
group   = "ssh / forwarding"
key     = "X11Forwarding"
value   = "no"
default = "yes"
title   = "No X11 forwarding"
desc    = "Remote apps can't draw locally"
why     = "X11 forwarding gives the remote host your keystrokes"
risk    = "safe"
breaks  = "Running remote GUI apps over SSH"

[[flag]]
id      = "ssh_allow_agent_forwarding"
group   = "ssh / forwarding"
key     = "AllowAgentForwarding"
value   = "no"
default = "yes"
title   = "No agent forwarding"
desc    = "Your keys stay on your machine"
why     = "Root on the remote host can use your forwarded agent to log in anywhere"
risk    = "safe"
breaks  = "Chained SSH hops using your local keys"

[[flag]]
id      = "ssh_allow_tcp_forwarding"
group   = "ssh / forwarding"
key     = "AllowTcpForwarding"
value   = "no"
default = "yes"
title   = "No TCP forwarding"
desc    = "No tunnels through this host"
why     = "Port forwarding turns sshd into a pivot into your network"
risk    = "caution"
breaks  = "ssh -L / -D tunnels and SOCKS proxying"

[[flag]]
id      = "ssh_permit_tunnel"
group   = "ssh / forwarding"
key     = "PermitTunnel"
value   = "no"
default = "no"
title   = "No tun device tunnels"
desc    = "No layer-3 VPN over SSH"
why     = "A tun tunnel bridges networks straight through the host"
risk    = "safe"

[[flag]]
id      = "ssh_gateway_ports"
group   = "ssh / forwarding"
key     = "GatewayPorts"
value   = "no"
default = "no"
title   = "Forwards stay local"
desc    = "Remote forwards bind loopback only"
why     = "Otherwise a forwarded port is exposed to the whole network"
risk    = "safe"

[[flag]]
id      = "ssh_permit_user_environment"
group   = "ssh / forwarding"
key     = "PermitUserEnvironment"
value   = "no"
default = "no"
title   = "Ignore user environment"
desc    = "No ~/.ssh/environment"
why     = "LD_PRELOAD in a user file is a privilege-escalation primitive"
risk    = "safe"

[[flag]]
id      = "ssh_compression"
group   = "ssh / forwarding"
key     = "Compression"
value   = "no"
default = "yes"
title   = "No compression"
desc    = "Removes pre-auth zlib parsing"
why     = "Compression before auth has a bad CVE history, and leaks length info"
risk    = "safe"

# --------------------------------------------------------------------------- #
#  crypto
# --------------------------------------------------------------------------- #

[[flag]]
id      = "ssh_kex_algorithms"
group   = "ssh / crypto"
key     = "KexAlgorithms"
value   = "curve25519-sha256"
default = "(openssh default set)"
title   = "Modern key exchange only"
desc    = "curve25519 and nothing else"
why     = "Drops DH group exchange and every NIST-curve fallback"
risk    = "caution"
breaks  = "Old clients that don't speak curve25519"

[[flag]]
id      = "ssh_ciphers"
group   = "ssh / crypto"
key     = "Ciphers"
value   = "chacha20-poly1305@openssh.com,aes256-gcm@openssh.com"
default = "(openssh default set)"
title   = "AEAD ciphers only"
desc    = "ChaCha20 and AES-256-GCM"
why     = "Only authenticated-encryption modes, no CBC"
risk    = "caution"
breaks  = "Old clients without AEAD support"

[[flag]]
id      = "ssh_macs"
group   = "ssh / crypto"
key     = "MACs"
value   = "hmac-sha2-512-etm@openssh.com"
default = "(openssh default set)"
title   = "Encrypt-then-MAC only"
desc    = "One strong ETM algorithm"
why     = "Encrypt-then-MAC avoids the whole MAC-then-encrypt bug class"
risk    = "caution"
breaks  = "Old clients without ETM MACs"

[[flag]]
id      = "ssh_host_key_algorithms"
group   = "ssh / crypto"
key     = "HostKeyAlgorithms"
value   = "ssh-ed25519"
default = "(openssh default set)"
title   = "Ed25519 host keys only"
desc    = "No RSA or ECDSA host keys"
why     = "One modern algorithm, no downgrade path"
help    = "Requires an ed25519 host key to exist — every stock Ubuntu install has one."
risk    = "caution"
breaks  = "Clients pinned to your old RSA host key (they see a key-change warning)"

# --------------------------------------------------------------------------- #
#  logging & exposure
# --------------------------------------------------------------------------- #

[[flag]]
id      = "ssh_log_level"
group   = "ssh / logging"
key     = "LogLevel"
value   = "VERBOSE"
default = "INFO"
title   = "Verbose logging"
desc    = "Logs the key fingerprint used"
why     = "Without VERBOSE you can't tell which key logged in"
risk    = "safe"

[[flag]]
id      = "ssh_banner"
group   = "ssh / logging"
key     = "Banner"
value   = "/etc/issue.net"
default = "none"
title   = "Pre-login banner"
desc    = "Shows /etc/issue.net before auth"
why     = "Required by most compliance regimes; states there is no implied access"
risk    = "safe"

[[flag]]
id       = "ssh_port"
group    = "ssh / logging"
key      = "Port"
value    = "22"
default  = "22"
editable = true
pattern  = "[1-9][0-9]{0,4}"
title    = "Listening port"
desc    = "Move off 22 to cut log noise"
why     = "Not security by itself, but it removes almost all drive-by scanning"
help    = "Change the value here, then remember to allow the new port in the firewall — the app cross-checks that at review time."
risk    = "caution"
breaks  = "Clients still connecting to the old port"

# --------------------------------------------------------------------------- #
#  more restrictions
# --------------------------------------------------------------------------- #

[[flag]]
id       = "ssh_allow_groups"
group    = "ssh / authentication"
key      = "AllowGroups"
value    = ""
default  = ""
editable = true
pattern  = "[a-z_][a-z0-9_-]{0,31}( [a-z_][a-z0-9_-]{0,31})*"
title    = "Allowed groups"
desc     = "Group-based login allowlist"
why      = "Easier to maintain than a user list — add someone to the group, not to sshd_config"
risk     = "caution"
breaks   = "Login for anyone outside the listed groups"

[[flag]]
id      = "ssh_disable_forwarding"
group   = "ssh / forwarding"
key     = "DisableForwarding"
value   = "yes"
default = "no"
title   = "Disable all forwarding"
desc    = "One switch for every tunnel type"
why     = "Covers TCP, X11, agent, tun and Unix-socket forwarding in a single directive, so nothing is missed"
risk    = "caution"
breaks  = "Every kind of SSH tunnel"

[[flag]]
id      = "ssh_allow_stream_local_forwarding"
group   = "ssh / forwarding"
key     = "AllowStreamLocalForwarding"
value   = "no"
default = "yes"
title   = "No Unix-socket forwarding"
desc    = "Blocks forwarded local sockets"
why     = "A forwarded Unix socket reaches services that never listen on the network at all"
risk    = "safe"
breaks  = "Forwarding a Docker or database socket over SSH"

[[flag]]
id      = "ssh_required_rsa_size"
group   = "ssh / crypto"
key     = "RequiredRSASize"
value   = "3072"
default = "1024"
title   = "Minimum RSA key size"
desc    = "Rejects short RSA keys"
why     = "A 1024-bit RSA key is within reach of a well-funded attacker"
risk    = "caution"
breaks  = "Anyone still using a 2048-bit or smaller key"

[[flag]]
id      = "ssh_pubkey_accepted_algorithms"
group   = "ssh / crypto"
key     = "PubkeyAcceptedAlgorithms"
value   = "ssh-ed25519,sk-ssh-ed25519@openssh.com"
default = "(openssh default set)"
title   = "Ed25519 keys only"
desc    = "Refuses RSA and ECDSA client keys"
why     = "One modern algorithm, and hardware keys, with no downgrade path"
risk    = "breaking"
breaks  = "Every client whose key is not Ed25519"

[[flag]]
id      = "ssh_use_dns"
group   = "ssh / logging"
key     = "UseDNS"
value   = "no"
default = "no"
title   = "No reverse DNS on connect"
desc    = "Skips looking up the client name"
why     = "A reverse lookup makes login depend on DNS, and the answer is attacker-controlled"
risk    = "safe"

[[flag]]
id      = "ssh_tcp_keepalive"
group   = "ssh / limits"
key     = "TCPKeepAlive"
value   = "no"
default = "yes"
title   = "No TCP keepalives"
desc    = "Relies on the SSH-level check instead"
why     = "TCP keepalives are spoofable; ClientAliveInterval is inside the encrypted channel"
risk    = "safe"

[[flag]]
id      = "ssh_expose_auth_info"
group   = "ssh / logging"
key     = "ExposeAuthInfo"
value   = "no"
default = "no"
title   = "Don't expose auth details"
desc    = "Keeps auth info out of the session"
why     = "Otherwise the session environment carries how you authenticated, for anything in it to read"
risk    = "safe"

# --------------------------------------------------------------------------- #
#  brute-force resistance
#
#  OpenSSH 9.8 moved rate limiting into sshd itself. On a machine running it,
#  these do what fail2ban was installed for, without the extra daemon. sshd -t
#  rejects an unknown directive, and the helper runs that before installing, so
#  an older sshd refuses the file rather than silently ignoring the line.
# --------------------------------------------------------------------------- #

[[flag]]
id      = "ssh_per_source_penalties"
group   = "ssh / limits"
key     = "PerSourcePenalties"
value   = "yes"
default = "no"
title   = "Penalise failing sources"
desc    = "Escalating timeouts per source address"
why     = "A source that keeps failing authentication is progressively refused, which is what stops a distributed password guess without a log-scraping daemon"
risk    = "safe"
breaks  = "Needs OpenSSH 9.8 or newer; older sshd will reject the config outright"

[[flag]]
id      = "ssh_per_source_max_startups"
group   = "ssh / limits"
key     = "PerSourceMaxStartups"
value   = "4"
default = "none"
title   = "Cap sessions per source"
desc    = "Four unauthenticated connections per address"
why     = "MaxStartups alone is global, so one host can fill the whole unauthenticated queue and lock everyone else out"
risk    = "safe"
breaks  = "Needs OpenSSH 9.8+. Too low a value breaks legitimate parallel tooling like Ansible forks"

[[flag]]
id      = "ssh_unused_connection_timeout"
group   = "ssh / limits"
key     = "UnusedConnectionTimeout"
value   = "300"
default = "none"
title   = "Drop idle multiplexed sessions"
desc    = "Closes connections holding no channel"
why     = "A ControlMaster socket left open is a live authenticated session sitting on the machine with nothing using it"
risk    = "safe"

# --------------------------------------------------------------------------- #
#  authentication methods that should not be on
# --------------------------------------------------------------------------- #

[[flag]]
id      = "ssh_gssapi_off"
group   = "ssh / authentication"
key     = "GSSAPIAuthentication"
value   = "no"
default = "no"
title   = "No GSSAPI auth"
desc    = "Kerberos single sign-on off"
why     = "Adds a whole authentication path and its key exchange to the attack surface for a feature almost no desktop uses"
risk    = "safe"
breaks  = "Kerberos/Active Directory single sign-on over SSH"

[[flag]]
id      = "ssh_kerberos_off"
group   = "ssh / authentication"
key     = "KerberosAuthentication"
value   = "no"
default = "no"
title   = "No Kerberos auth"
desc    = "Password-to-KDC validation off"
why     = "Same reasoning as GSSAPI: an authentication path that is enabled by default and almost never used"
risk    = "safe"
breaks  = "Kerberos realms"

[[flag]]
id      = "ssh_ignore_user_known_hosts"
group   = "ssh / authentication"
key     = "IgnoreUserKnownHosts"
value   = "yes"
default = "no"
title   = "Ignore user known_hosts"
desc    = "Only root's list counts for host-based auth"
why     = "With host-based authentication on, a user's own ~/.ssh/known_hosts would otherwise let them nominate which hosts to trust"
risk    = "safe"

[[flag]]
id      = "ssh_pubkey_verify_required"
group   = "ssh / authentication"
key     = "PubkeyAuthOptions"
value   = "verify-required"
default = "none"
title   = "Require the security key touch"
desc    = "FIDO2 keys must verify the user"
why     = "Without it a resident FIDO2 key authenticates on possession alone; with it the key demands a PIN or biometric first"
risk    = "breaking"
breaks  = "Locks out every key that is not a verifying FIDO2 token — ordinary ed25519 and RSA keys stop working"

# --------------------------------------------------------------------------- #
#  forwarding limits
# --------------------------------------------------------------------------- #

[[flag]]
id      = "ssh_permit_open_none"
group   = "ssh / forwarding"
key     = "PermitOpen"
value   = "none"
default = "any"
title   = "No local forward targets"
desc    = "-L cannot reach anything"
why     = "AllowTcpForwarding no is the blunt version; this keeps forwarding usable while naming nothing it may reach"
risk    = "caution"
breaks  = "Any ssh -L tunnel, and tools like VS Code Remote that build one"

[[flag]]
id      = "ssh_permit_listen_none"
group   = "ssh / forwarding"
key     = "PermitListen"
value   = "none"
default = "any"
title   = "No remote forward listeners"
desc    = "-R cannot open a port"
why     = "A remote forward turns your server into an entry point for whatever is on the other end of the client's connection"
risk    = "caution"
breaks  = "ssh -R reverse tunnels"

[[flag]]
id      = "ssh_stream_local_bind_unlink"
group   = "ssh / forwarding"
key     = "StreamLocalBindUnlink"
value   = "yes"
default = "no"
title   = "Clean up forwarded sockets"
desc    = "Removes stale Unix sockets"
why     = "A leftover socket file from a dead session is a path another process can sit on and answer for"
risk    = "safe"

# --------------------------------------------------------------------------- #
#  crypto & session hygiene
# --------------------------------------------------------------------------- #

[[flag]]
id      = "ssh_rekey_limit"
group   = "ssh / crypto"
key     = "RekeyLimit"
value   = "512M 1h"
default = "default none"
title   = "Rekey regularly"
desc    = "New keys every 512 MB or hour"
why     = "Bounds how much traffic any single session key protects, so recovering one key exposes a slice rather than the session"
risk    = "safe"

[[flag]]
id      = "ssh_ca_signature_algorithms"
group   = "ssh / crypto"
key     = "CASignatureAlgorithms"
value   = "ssh-ed25519,ecdsa-sha2-nistp256,rsa-sha2-512,rsa-sha2-256"
default = "includes ssh-rsa"
title   = "Modern CA signatures only"
desc    = "Drops SHA-1 from certificate checks"
why     = "The certificate path has its own algorithm list, so restricting HostKeyAlgorithms leaves SHA-1 usable for CA-signed logins"
risk    = "caution"
breaks  = "An internal SSH CA still issuing ssh-rsa (SHA-1) certificates"

[[flag]]
id      = "ssh_fingerprint_hash"
group   = "ssh / logging"
key     = "FingerprintHash"
value   = "sha256"
default = "sha256"
title   = "SHA-256 fingerprints"
desc    = "No MD5 in the logs"
why     = "An MD5 fingerprint in an audit log cannot be relied on to identify a key"
risk    = "safe"

[[flag]]
id      = "ssh_print_last_log"
group   = "ssh / logging"
key     = "PrintLastLog"
value   = "yes"
default = "yes"
title   = "Show the last login"
desc    = "Prints when and from where, at login"
why     = "The cheapest intrusion detection there is: the user sees a login they did not make"
risk    = "safe"
