# Ptyxis terminal palettes, ported for the GTK theme engine.
#
# The 33 `set = "extended"` entries were extracted verbatim from the Ptyxis
# gresource bundle and carry their complete 16-slot ANSI table. The 11
# `set = "curated"` entries keep the hand-picked accents from Ptyxis.kt.
# Surfaces are derived at runtime by mixing background toward foreground and
# black, so every palette keeps its own hue.

[family]
key = "ptyxis"
name = "Ptyxis"

