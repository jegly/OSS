# stock — generated by tools/build_presets.py from the catalogue's risk ratings.
# Do not hand-edit: rerun the tool instead.
#
# Read from the live system, not from its config files, so it records what was actually in effect rather than what someone meant to set. The full capture (§5.2) additionally reports duplicate keys, invalid keys and conflicts; this does not.

